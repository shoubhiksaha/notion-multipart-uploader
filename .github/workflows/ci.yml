name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20, 22, 24 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # The workspace links the MCP server to this commit's library, so this catches library changes that break the server
      - run: npm run test:mcp

  integration:
    # Uploads to a real Notion workspace, so it only runs on main and manual runs (pull requests from forks get no secrets)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      NOTION_KEY: ${{ secrets.NOTION_KEY }}
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
      NOTION_TEST_LARGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Run live Notion tests
        # Skipped until the NOTION_KEY and NOTION_PAGE_ID repository secrets are set
        if: env.NOTION_KEY != '' && env.NOTION_PAGE_ID != ''
        run: npm run test:integration
