name: Release

# Push a tag to publish: vX.Y.Z publishes notion-multipart-uploader,
# mcp-vX.Y.Z publishes notion-large-file-upload-mcp from mcp-server/ to npm and the MCP Registry.
on:
  push:
    tags: [ 'v*', 'mcp-v*' ]

# Both packages are published with npm trusted publishing: npmjs.com trusts this workflow file in this
# repository (configured under each package's Settings -> Trusted Publisher), so there is no npm token
# anywhere, and npm attaches provenance automatically.
permissions:
  contents: read
  # Lets the job get the GitHub OIDC token that npm and the MCP Registry verify
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm 11.5.1+ is required for trusted publishing; Node 24 ships with it
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm test

      - name: Publish notion-multipart-uploader
        if: startsWith(github.ref_name, 'v')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
          # Safe to re-run: a version that is already on npm is left alone
          if npm view "notion-multipart-uploader@${version#v}" version >/dev/null 2>&1; then
            echo "notion-multipart-uploader ${version#v} is already on npm, skipping publish"
          else
            npm publish --provenance --access public
          fi

      - name: Publish notion-large-file-upload-mcp
        if: startsWith(github.ref_name, 'mcp-v')
        run: |
          version="mcp-v$(node -p "require('./mcp-server/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match mcp-server/package.json version $version"
            exit 1
          fi
          # Inside the repo, the workspace links the server to the local library. Users get the published
          # library instead (`npx -y` resolves the ranges fresh), so the release is tested from a copy
          # outside the repo, where npm installs from the registry exactly as it does for them.
          cp -r mcp-server "$RUNNER_TEMP/mcp-server"
          cd "$RUNNER_TEMP/mcp-server"
          npm install --no-package-lock
          npm test
          # The first version is published by hand (npm can't trust a workflow for a package that doesn't
          # exist yet), so this skips a version that is already on npm and goes on to the registry listing
          if npm view "notion-large-file-upload-mcp@${version#mcp-v}" version >/dev/null 2>&1; then
            echo "notion-large-file-upload-mcp ${version#mcp-v} is already on npm, skipping publish"
          else
            npm publish --provenance --access public
          fi

      # Lists the server in the official MCP Registry (registry.modelcontextprotocol.io) from server.json.
      # The registry checks the npm package's mcpName, so this has to run after npm publish.
      - name: Publish notion-large-file-upload-mcp to the MCP Registry
        if: startsWith(github.ref_name, 'mcp-v')
        working-directory: mcp-server
        env:
          MCP_PUBLISHER_VERSION: '1.8.6'
        run: |
          # Runs in the repo's mcp-server/ because it only needs server.json
          base="https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER_VERSION"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$base/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          # Uses this workflow's GitHub OIDC token, which may publish io.github.shoubhiksaha/* names
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
